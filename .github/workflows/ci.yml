name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      # The suite skips whatever needs the game data, which lives outside the
      # repository. The path-containment tests do not, and they are the ones
      # guarding untrusted tool arguments — so require them explicitly rather
      # than letting an all-skipped run pass for green.
      - name: Path containment tests
        run: python -m pytest tests/test_path_safety.py -v

      - name: Full suite
        run: python -m pytest tests -v
